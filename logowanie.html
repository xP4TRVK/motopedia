<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | MotoPedia</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="main-nav">
        <div class="nav-logo">
            <a href="/"><img src="aalogo_motopedia.png" alt="MotoPedia Logo"></a>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">STRONA GŁÓWNA</a></li>
            <li><a href="kolekcja.html">KOLEKCJA</a></li>
            <li><a href="o-nas.html">O NAS</a></li>
        </ul>

        <div class="nav-actions" id="nav-actions">
            <div class="nav-notifications hidden" id="notif-trigger">
                <svg class="notif-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            <div class="notif-dropdown hidden" id="notif-dropdown"></div>
            </div>
            <button onclick="window.location.href='logowanie.html'" class="btn-primary">ZALOGUJ SIĘ</button>
        </div>
        
        <button id="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <div class="section-divider"></div>

    <main class="login-page-wrapper">
        <div class="form-container">
            <div class="form-nav">
                <a href="#" id="to-login" class="active-tab">Zaloguj się</a>
                <span class="nav-divider">|</span>
                <a href="#" id="to-register">Zarejestruj się</a>
            </div>

            <div id="login-form" class="login-form-log">
                <form>
                    <input type="text" name="login" placeholder="Login" required>
                    <input type="password" name="haslo" placeholder="Hasło" required>
                    <button type="submit" class="btn-primary">ZALOGUJ</button>
                </form>
            </div>

            <div id="register-form" class="register-form-log">
                <form>
                    <input type="text" name="login" placeholder="Wpisz Login" required>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="password" name="haslo" placeholder="Hasło" required>
                    
                    <select name="plec" required>
                        <option value="" disabled selected>Wybierz płeć</option>
                        <option value="kobieta">Kobieta</option>
                        <option value="mezczyzna">Mężczyzna</option>
                    </select>
                    
                    <button type="submit" class="btn-primary">ZAŁÓŻ KONTO</button>
                </form>
            </div>
        </div>
    </main>

    <div id="toast-box" class="toast"></div>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="section-divider footer-line"></div>
            <p>&copy; 2026 MotoPedia - Twoje źródło wiedzy o autach.</p>
            <p>Strona ma charakter wyłącznie edukacyjny w ramach projektu inżynierskiego. Wykorzystane materiały graficzne należą do ich właścicieli i zostały użyte na mocy prawa cytatu.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
