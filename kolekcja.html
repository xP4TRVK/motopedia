        </div>
        
        <button id="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <div class="section-divider"></div>

    <main>
        <div class="collection-container">
            <h1 class="container-title-glow">PEŁNA KOLEKCJA SAMOCHODÓW</h1>
            
            <div class="collection-tools-wrapper">
            <div class="tools-container">
        
            <div class="search-box-custom">
                <input type="text" id="searchInput" placeholder="Czego szukasz? (np. Porsche...)" autocomplete="off">
                <button id="searchBtn" class="btn-search-trigger">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

                <button id="filterToggleBtn" class="btn-filter-toggle">FILTRY</button>

            </div>

    <div id="filterPanel" class="filter-panel">
        <div class="filter-grid-layout">
        
            <div class="filter-column">
            <label for="sortFilter">Kolejność wyświetlania</label>
                <select id="sortFilter" class="filter-select">
                    <option value="newest">Najnowsze</option>
                    <option value="oldest">Najstarsze</option>
                </select>
            </div>

            <div class="filter-column">
                <label for="powerFilter">Moc silnika (KM)</label>
                <select id="powerFilter" class="filter-select">
                    <option value="all">Wszystkie moce</option>
                    <option value="0-300">Poniżej 300 KM</option>
                    <option value="300">Powyżej 300 KM</option>
                    <option value="500">Powyżej 500 KM</option>
                    <option value="700">Powyżej 700 KM</option>
                </select>
            </div>

            <div class="filter-column">
                <label for="yearFilter">Rok produkcji</label>
                <select id="yearFilter" class="filter-select">
                    <option value="all">Wszystkie lata</option>
                    <option value="2020_up">Nowoczesne (2020+)</option>
                    <option value="2010-2019">2010-2019</option>
                    <option value="2000-2009">2000-2009</option>
                    <option value="2000_down">Klasyki (przed 2000)</option>
                </select>
            </div>

        </div>

        <div class="filter-actions">
            <button id="resetFiltersBtn" class="btn-reset-filters">
            ↺ Resetuj filtry
            </button>
        </div>
    </div>
            </div>

            <div id="lista-pojazdow-pelna" class="collection-grid"></div>
        </div>

        
    </main>

    <div id="toast-box" class="toast"></div>

        </div>
    </footer>
